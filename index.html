<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Imagem para PDF</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Imagem para PDF</h1>
        <p class="subtitle">Converta suas imagens em arquivos PDF rapidamente</p>
        
        <div class="upload-area" id="drop-zone">
            <label for="arquivo" class="upload-label">
                <span class="icon">📸</span>
                <span class="text">Clique para selecionar ou arraste a imagem aqui</span>
            </label>
            <input id="arquivo" type="file" accept="image/*">
            <div id="file-name" class="file-name"></div>
        </div>

        <button id="converter" class="btn-convert">Gerar PDF</button>
    </div>
</body>
</html>
